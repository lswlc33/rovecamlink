name: Docs check

# 文档系统守卫：让「引用一个 doc-id」永远机器可验证，而不是靠提交前记得跑。
# 三个自包含检查器在 CI 上跑（纯静态、零第三方依赖、秒级）：
#   check-refs   —— doc-id 引用解析 + § 小节号存在性 + 层索引孤儿检查
#   check-links  —— Markdown 相对链接可达（含「目标里带空格」这类必然 404 的写法）
#   check-tables —— GFM 表格列数与表头一致
#
# check-citations 不在 CI：它要把每条 `文件:行号` 引用比对到反编译语料，而语料
# （_work/*_src，来自厂商 APK）与 APK 本体都是 gitignore 的本地文件。它在本地跑：
#   node tools/re/check-citations.mjs docs
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: check-refs（doc-id + § 小节 + 孤儿文档）
        run: node tools/re/check-refs.mjs
      - name: check-links（相对链接可达）
        run: node tools/re/check-links.mjs docs
      - name: check-tables（表格列数）
        run: node tools/re/check-tables.mjs docs
