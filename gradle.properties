org.gradle.jvmargs=-Xmx4096M -Dfile.encoding=UTF-8 -Dkotlin.daemon.jvm.options=-Xmx3072M
org.gradle.caching=true
org.gradle.configuration-cache=false
org.gradle.parallel=true

# No proxy settings here, on purpose. The four `systemProp.*` lines that used to sit
# here pointed at 127.0.0.1:18080 — an agent sandbox's egress that is not this
# machine — and on a GitHub runner nothing listens there, so any job that had to
# resolve a dependency died with "Connection refused" through a dead proxy
# (`Release Test` on test-v0.1.1, 2026-09-22). A machine-local proxy belongs in
# $GRADLE_USER_HOME/gradle.properties, which is not shipped to CI.

# AGP 9 stopped letting `com.android.application` sit beside
# `org.jetbrains.kotlin.multiplatform`; these two are AGP's own documented bypass, not a
# migration. The real fix is moving the android target onto
# `com.android.kotlin.multiplatform.library`, which also reaches the release-signing config
# and the `android.defaultConfig.versionName` the desktop packager reads. Until then the
# nightly/release APK build is running on borrowed compatibility, so do not treat a green
# Android CI run as "migrated".
android.builtInKotlin=false
android.newDsl=false

kotlin.code.style=official
kotlin.daemon.useFallbackStrategy=false

android.useAndroidX=true
android.nonTransitiveRClass=true

# KMP / Compose
org.jetbrains.compose.experimental.jscanvas.enabled=true
kotlin.mpp.enableCInteropCommonization=true
kotlin.native.ignoreDisabledTargets=true
